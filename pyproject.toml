[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-material"
version = "3.0.0a0"
description = "Modern Material Design 3 components and full-featured CRUD/admin interfaces for Django"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Mikhail Podgurskiy", email = "mikhail@viewflow.io"},
]
maintainers = [
    {name = "Mikhail Podgurskiy", email = "mikhail@viewflow.io"},
]
keywords = ["django", "material", "design", "components", "ui", "framework", "crud", "admin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "django>=5.2",
    "django-cotton>=2.0.0",
    "django-filter>=25.1",
]

[project.urls]
Homepage = "https://material.viewflow.io"
Documentation = "https://material.viewflow.io"
Repository = "https://github.com/viewflow/django-material"
Issues = "https://github.com/viewflow/django-material/issues"
Changelog = "https://github.com/viewflow/django-material/releases"

[dependency-groups]
dev = [
    "ansible>=9.5.0",
    "black>=25.1.0",
    "django-cursor-pagination>=0.3.0",
    "django-formtools>=2.5.1",
    "django-redis>=5.4.0",
    "django-stubs>=5.1.3",
    "ipdb>=0.13.13",
    "ruff>=0.5.0",
    "django-debug-toolbar>=5.2.0",
    "django-import-export>=4.3.7",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]
prod = [
    "gunicorn>=21.2.0",
]

[tool.setuptools.packages.find]
include = ["material*"]
exclude = ["demo*", "tests*", "config*", "node_modules*"]

[tool.setuptools.package-data]
material = [
    "static/**/*",
    "templates/**/*",
]

[tool.pyright]
include = ["material", ]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "W",    # pycodestyle warnings
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
]
ignore = [
  "E501",    # line too long - handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["material", "demo"]
