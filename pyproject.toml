[project]
name = "django-material"
version = "0.1.0"
description = "Material Design UI components for Django templates, no npm required."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "Mikhail Podgurskiy", email = "kmmbvnr@gmail.com" }
]
dependencies = [
  "Django>=5.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/RobustaRush/django-material"
Repository = "https://github.com/RobustaRush/django-material"
Issues = "https://github.com/RobustaRush/django-material/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["material"]

[dependency-groups]
dev = []
