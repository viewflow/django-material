[project]
name = "material"
version = "0.1.0"
description = "Modern Material Design framework for Django"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-cotton>=2.0.0",
    "django-debug-toolbar>=5.2.0",
    "django-filter>=25.1",
    "django-import-export>=4.3.7",
]

[dependency-groups]
dev = [
    "ansible>=9.5.0",
    "black>=25.1.0",
    "django-cursor-pagination>=0.3.0",
    "django-formtools>=2.5.1",
    "django-redis>=5.4.0",
    "django-stubs>=5.1.3",
    "ipdb>=0.13.13",
    "ruff>=0.5.0",
]
prod = [
    "gunicorn>=21.2.0",
]

[tool.pyright]
include = ["material", ]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "W",    # pycodestyle warnings
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
]
ignore = [
  "E501",    # line too long - handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["material", "demo"]
