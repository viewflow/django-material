<c-forms.text.outlined
  id="id_{{ widget.name }}"
  name="{{ widget.name }}" 
  type="password"
  help_text="{{ bound_field.help_text }}"
  value="{{ widget.value|default:'' }}"
  :disabled=widget.attrs.disabled
  :required=widget.attrs.required
  :readonly=widget.attrs.readonly
  :color=widget.attrs.color
  :leading_icon=widget.attrs.leading_icon
  :trailing_button="{'icon': 'visibility_off', 'title': 'Toggle password visibility'}"
  :error=bound_field.errors.0
  up-password-field
>{{ bound_field.label }}</c-forms.text.outlined>
