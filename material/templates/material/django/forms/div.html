{% if errors %}
<div class="mb-4 p-4 rounded-lg bg-error-50 border border-error-200" role="alert">
  {{ errors }}
</div>
{% endif %}

<div class="flex flex-col gap-4 w-full {% if attrs.class %}{{ attrs.class }}{% endif %}">
  {% for field, errors in fields %}
    {{ field }}
  {% endfor %}
  {% if forloop.last %}
    {% for field in hidden_fields %}{{ field }}{% endfor %}
  {% endif %}
</div>
