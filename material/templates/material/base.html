<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}django-material{% endblock %}</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
