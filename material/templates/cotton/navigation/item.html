<li class="px-2 mb-1">
  <a href="{{ url|default:'#' }}" 
     class="
       flex items-center
       rounded-lg
       px-3 py-2
       transition-colors duration-200
       {% if active %}
         bg-primary/10 text-primary font-medium
       {% else %}
         hover:bg-on-surface/10 text-on-surface
       {% endif %}
       {% if density == 'compact' %}
         text-sm
       {% endif %}
     "
     {% if active %}
       aria-current="page"
     {% endif %}
     {% if onclick %}
       onclick="{{ onclick }}"
     {% endif %}
  >
    {% if icon %}
      <span class="
        {% if variant == 'rail' %}
          mx-auto
        {% else %}
          mr-3
        {% endif %}
        {% if active %}
          text-primary
        {% else %}
          text-on-surface/70
        {% endif %}
      ">
        {{ icon }}
      </span>
    {% endif %}
    
    {% if variant != 'rail' %}
      <span class="truncate">{{ label|default:slot }}</span>
    {% endif %}
    
    {% if badge %}
      <span class="ml-auto {% if badge_color %}{{ badge_color }}{% else %}bg-primary text-on-primary{% endif %} text-xs px-2 py-0.5 rounded-full">
        {{ badge }}
      </span>
    {% endif %}
    
    {% if expandable %}
      <span class="ml-auto transform transition-transform duration-200 
        {% if expanded %}
          rotate-180
        {% endif %}
      ">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </span>
    {% endif %}
  </a>
  
  {% if expandable and children %}
    <div class="mt-1 ml-6 pl-3 border-l border-on-surface/20 overflow-hidden
      {% if expanded %}
        max-h-96 opacity-100
      {% else %}
        max-h-0 opacity-0
      {% endif %}
      transition-all duration-300
    ">
      {{ children }}
    </div>
  {% endif %}
</li>
