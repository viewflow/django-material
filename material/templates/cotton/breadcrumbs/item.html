<li class="flex items-center">
  {% if not first %}
    <span class="mx-2 text-on-surface/40 inline-flex" style="transform: translateY(-1px);" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path>
      </svg>
    </span>
  {% endif %}
  
  {% if href %}
    <a href="{{ href }}" class="flex items-center text-on-surface/70 hover:text-primary transition-colors focus:outline-none focus:text-primary">
      {% if icon %}
        <span class="material-icons mr-1" style="font-size: 16px; display: inline-flex; align-items: center; transform: translateY(-1px);">{{ icon }}</span>
      {% endif %}
      {{ slot }}
    </a>
  {% else %}
    <span class="flex items-center font-medium text-on-surface" aria-current="page">
      {% if icon %}
        <span class="material-icons mr-1" style="font-size: 16px; display: inline-flex; align-items: center; transform: translateY(-1px);">{{ icon }}</span>
      {% endif %}
      {{ slot }}
    </span>
  {% endif %}
</li>
