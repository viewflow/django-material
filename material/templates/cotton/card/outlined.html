<c-vars
  color="primary"
  class="relative flex flex-col overflow-hidden rounded-lg border border-outline-variant transition-all duration-300 ease-in-out hover:border-outline"
  footer_class="" />

<div class="{{ class }} bg-surface">
  {% if title or menu %}
  <div class="flex items-center justify-between p-4 pb-2">
    <div class="flex-grow">
      {% if title %}
      <h3 class="text-lg font-medium">{{ title }}</h3>
      {% endif %}
      {% if subtitle %}
      <p class="text-sm text-on-surface-variant">{{ subtitle }}</p>
      {% endif %}
    </div>
    {% if menu %}
    <div class="ml-4">
      {{ menu }}
    </div>
    {% endif %}
  </div>
  {% endif %}
  
  <div class="p-4 flex-grow">
    {{ slot }}
  </div>
  
  {% if footer %}
  <div class="p-4 pt-2 border-t border-outline-variant {{ footer_class }}">
    {{ footer }}
  </div>
  {% endif %}
</div>
