<section class="
    rounded-xl overflow-hidden
    {% if hover_border %}
      border-transparent hover:border-solid
    {% else %}
      border border-solid
    {% endif %}
    flex flex-col h-full
    {% if color == 'secondary' %}
        {% if hover_border %}
          border hover:border-secondary text-secondary
        {% else %}
          border-secondary text-secondary
        {% endif %}
    {% elif color == 'tertiary' %}
        {% if hover_border %}
          border hover:border-tertiary text-tertiary
        {% else %}
          border-tertiary text-tertiary
        {% endif %}
    {% else %}
        {% if hover_border %}
          border hover:border-primary text-primary
        {% else %}
          border-primary text-primary
        {% endif %}
    {% endif %}
    {% if hover_border %}
      hover:shadow-sm
    {% endif %}
    transition-all duration-300
    bg-transparent
  ">
  {% if title %}
    <header class="p-4 pb-0 flex-shrink-0 flex justify-between items-start">
      <div>
        <h3 class="text-lg font-medium">{{ title }}</h3>
        {% if subtitle %}
          <p class="text-sm text-on-surface/60 mt-1">{{ subtitle }}</p>
        {% endif %}
      </div>
      {% if menu %}
        <div class="ml-2">
          {{ menu }}
        </div>
      {% endif %}
    </header>
  {% elif menu %}
    <header class="p-4 pb-0 flex-shrink-0 flex justify-end">
      <div>
        {{ menu }}
      </div>
    </header>
  {% endif %}

  <div class="p-4 text-on-surface flex-grow">
    {{ slot }}
  </div>

  {% if footer %}
    <footer class="px-4 py-2 border-t border-outline/20 flex-shrink-0">
      {{ footer }}
    </footer>
  {% endif %}
</section>
