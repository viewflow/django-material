<section class="
    rounded-xl overflow-hidden
    shadow-md hover:shadow-lg 
    transition-shadow duration-300 ease-in-out
    bg-surface
    flex flex-col h-full
  ">
  {% if title %}
    <header class="p-4 pb-0 flex-shrink-0">
      <h3 class="text-lg font-medium text-on-surface">{{ title }}</h3>
      {% if subtitle %}
        <p class="text-sm text-on-surface/60 mt-1">{{ subtitle }}</p>
      {% endif %}
    </header>
  {% endif %}

  <div class="p-4 flex-grow">
    {{ slot }}
  </div>

  {% if footer %}
    <footer class="px-4 py-2 border-t border-outline/20 flex-shrink-0">
      {{ footer }}
    </footer>
  {% endif %}
</section>
