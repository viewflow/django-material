<tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
  {% if selectable %}
  <td class="w-4 p-4">
    <div class="flex items-center">
      <input id="checkbox-{{ row_id }}" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" />
      <label for="checkbox-{{ row_id }}" class="sr-only">checkbox</label>
    </div>
  </td>
  {% endif %}
  {{ slot }}
</tr>
