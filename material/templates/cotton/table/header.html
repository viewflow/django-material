<c-vars
  class="py-3 px-4 text-left font-medium"
  sortable="false"
  sort_direction=""
/>

<th scope="col" class="{{ class }}" {{ attrs }}>
  <div class="flex items-center gap-1">
    {{ slot }}
    {% if sortable == "true" %}
      <button type="button" class="text-on-surface-variant hover:text-on-surface focus:outline-none focus:ring-2 focus:ring-primary rounded" 
              aria-label="Sort column {{ slot|striptags }}{% if sort_direction == 'asc' %}, currently sorted ascending{% elif sort_direction == 'desc' %}, currently sorted descending{% else %}, not sorted{% endif %}">
        {% if sort_direction == "asc" %}
          <span class="material-symbols" aria-hidden="true">arrow_upward</span>
        {% elif sort_direction == "desc" %}
          <span class="material-symbols" aria-hidden="true">arrow_downward</span>
        {% else %}
          <span class="material-symbols opacity-50" aria-hidden="true">unfold_more</span>
        {% endif %}
      </button>
    {% endif %}
  </div>
</th>
