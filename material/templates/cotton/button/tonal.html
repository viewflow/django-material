<c-vars
  color="primary"
  class="inline-flex relative items-center justify-center rounded-full px-6 py-2 font-medium text-sm leading-6 transition-all duration-300 ease-in-out overflow-hidden hover:shadow-md focus:outline-none focus:shadow-md disabled:bg-surface-variant disabled:text-on-surface-variant disabled:shadow-none disabled:cursor-not-allowed active:ripple"
  icon_class="material-icons mr-2 leading-[1px] text-lg" />

<button
  class="{{ class }} bg-{{ color }}-container text-on-{{ color }}-container hover:bg-{{ color }}-container/80 focus:bg-{{ color }}-container/70"
  {% if disabled %}disabled{% endif %}
  {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
  role="button"
  {{ attrs }}>
  {% if icon %}
    <span class="{{ icon_class }}" aria-hidden="true">{{ icon }}</span>
  {% endif %}
  {{ slot }}
</button>
