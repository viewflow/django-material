<c-vars
  color="primary"
  variant="standard"
  base_class="inline-flex items-center justify-center rounded-full w-10 h-10 transition-all duration-300 ease-in-out overflow-hidden relative focus:outline-none disabled:text-on-surface-variant disabled:cursor-not-allowed active:ripple"
  icon_class="material-icons text-lg" />

{% if variant == "filled" %}
<button
  class="{{ base_class }} bg-{{ color }} text-on-{{ color }} hover:bg-{{ color }}/80 focus:bg-{{ color }}/70 {{ class }}"
  {% if disabled %}disabled{% endif %}
  {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
  role="button"
  up-ripple
  {{ attrs }}>
  <span class="{{ icon_class }}" aria-hidden="true">{{ slot }}</span>
</button>

{% elif variant == "tonal" %}
<button
  class="{{ base_class }} bg-{{ color }}-container text-on-{{ color }}-container hover:bg-{{ color }}-container/80 focus:bg-{{ color }}-container/70 {{ class }}"
  {% if disabled %}disabled{% endif %}
  {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
  role="button"
  up-ripple
  {{ attrs }}>
  <span class="{{ icon_class }}" aria-hidden="true">{{ slot }}</span>
</button>

{% elif variant == "outlined" %}
<button
  class="{{ base_class }} border border-outline text-{{ color }} hover:bg-{{ color }}/10 focus:bg-{{ color }}/20 {{ class }}"
  {% if disabled %}disabled{% endif %}
  {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
  role="button"
  up-ripple
  {{ attrs }}>
  <span class="{{ icon_class }}" aria-hidden="true">{{ slot }}</span>
</button>

{% else %}
<button
  class="{{ base_class }} text-{{ color }} hover:bg-{{ color }}/10 focus:bg-{{ color }}/20 {{ class }}"
  {% if disabled %}disabled{% endif %}
  {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
  role="button"
  up-ripple
  {{ attrs }}>
  <span class="{{ icon_class }}" aria-hidden="true">{{ slot }}</span>
</button>
{% endif %}
