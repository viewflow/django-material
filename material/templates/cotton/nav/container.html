<c-vars
  width="min-w-[280px] w-[280px] max-w-[280px]"
  layout="flex flex-col flex-shrink-0 h-screen sticky top-0"
  styling="p-2 bg-surface-bright shadow-md"
  transitions="transition-all duration-300 ease-in-out"
  responsive="max-md:fixed max-md:top-0 max-md:inset-inline-start-0 max-md:z-50 max-md:h-screen max-md:w-[280px]"
  state="max-md:-translate-x-full max-md:shadow-lg max-md:opacity-0 max-md:invisible"
  active_state="max-md:nav-open:translate-x-0 max-md:nav-open:opacity-100 max-md:nav-open:visible"
/>

<nav up-nav 
     role="navigation" 
     aria-label="Main navigation" 
     class="{{ width }} {{ layout }} {{ styling }} {{ transitions }} {{ responsive }} {{ state }} {{ active_state }}">
  {% if header %}
    <div class="p-2">
      {{ header }}
    </div>
  {% endif %}
  <ul role="list" class="flex-grow min-h-0 overflow-y-auto list-none">
    {{ slot }}
  </ul>
  {% if footer %}
    <div class="mt-auto pt-6 border-t border-outline-variant">
      <div class="flex items-center space-x-3">
        {{ footer }}
      </div>
    </div>
  {% endif %}
</nav>
