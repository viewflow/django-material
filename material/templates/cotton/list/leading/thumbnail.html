<c-vars
  image=""
  alt=""
  text="Thumbnail"
  base_class="w-16 h-12 rounded-md overflow-hidden bg-on-surface/10 flex items-center justify-center" />

<div class="{{ base_class }} {{ class }}" {{ attrs }}>
  {% if image %}
    <img src="{{ image }}" alt="{{ alt }}" class="w-full h-full object-cover">
  {% else %}
    <span class="text-xs text-on-surface/60">{{ text|default:slot }}</span>
  {% endif %}
</div>
