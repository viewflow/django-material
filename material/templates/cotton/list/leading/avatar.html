<c-vars
  image=""
  alt=""
  text=""
  base_class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center overflow-hidden" />

<div class="{{ base_class }} {{ class }}" {{ attrs }}>
  {% if image %}
    <img src="{{ image }}" alt="{{ alt }}" class="w-full h-full object-cover">
  {% else %}
    <span class="text-sm font-medium">{{ text|default:slot }}</span>
  {% endif %}
</div>
